name: Lint Ruby

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  rubocop:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: 'gemfiles/rubocop.gemfile'

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Lint Ruby code with Rubocop
        run: bundle exec rubocop
