name: Release Please

on:
  push:
    branches:
      - master
  # Re-run the RubyGems publish for the tag master already points at.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  rubygems-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Publishes through RubyGems trusted publishing: the job exchanges its
    # OIDC token for a short-lived RubyGems credential, so no API key and no
    # OTP are involved. The trusted publisher for this repository and workflow
    # file is configured on the gem's page at rubygems.org.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: rubygems/release-gem@v1
        with:
          await-release: false
